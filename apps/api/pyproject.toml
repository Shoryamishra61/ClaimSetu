[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handover29c-api"
version = "1.0.2"
description = "Handover29C prototype API. Independent hackathon prototype; all government integrations simulated."
requires-python = ">=3.10"

[tool.pytest.ini_options]
# rootdir-relative, so `python -m pytest` from apps/api works without PYTHONPATH
# gymnastics on Windows.
pythonpath = ["."]
testpaths = ["tests"]
# -q because the suite is read as a gate report, and a wall of dots hides the one
# line that matters.
addopts = "-q --strict-markers"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "invariant: an INV-xx product invariant from 06_STATE_MACHINE_SERVICE_BLUEPRINT.md",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# UP038/UP007 would rewrite `X | None` unions into forms that read worse here, and
# `from __future__ import annotations` already makes the modern syntax safe on 3.10.
ignore = ["E501"]
